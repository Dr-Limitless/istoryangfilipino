name: Deploy to Hostinger

# Manual until the first live deployment has been checked.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Upload to the live website (leave unchecked to preview)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Check deployment credentials
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Build the website
        # Public browser configuration recovered from the existing deployment
        # archive. Repository variables can override it without editing code.
        env:
          VITE_LEADERBOARD_ENABLED: ${{ vars.VITE_LEADERBOARD_ENABLED || 'false' }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || 'AIzaSyALs-fqRm80kQyR9aflGGG8rfDoZF2d-1c' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || 'storyangfilipino.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'storyangfilipino' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || 'storyangfilipino.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '952029323627' }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || '1:952029323627:web:6bcac2f64445e6845f2c2e' }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY || '6LdXRT8tAAAAAHJhAEZbu4Jj1jDyH2vR9RrzUAno' }}
        run: npm run build

      - name: Preview or upload built files
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ vars.FTPS_HOSTNAME || secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./dist/
          # This site-specific FTP account is already rooted at public_html.
          server-dir: ./
          state-name: .istoryangfilipino-deploy-state.json
          dry-run: ${{ !inputs.deploy }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.htaccess
